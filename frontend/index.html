<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Значок вкладки. PNG, а не SVG: знак растровый, и обводить его
         вручную значило бы рисовать заново — он перестал бы совпадать с
         плашкой в шапке. Размеры и назначение файлов — docs/brand.md. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/favicon-192.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <!-- Установка на домашний экран. Chrome смотрит в манифест,
         iOS — в мета-теги ниже: у него своего манифеста нет. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aurum-Ex" />
    <!-- interactive-widget=resizes-content: при открытии клавиатуры браузер
         сжимает саму страницу, а не накрывает её сверху. Без этого поле
         ввода уезжает под клавиатуру, человек тянет страницу, чтобы его
         увидеть, клавиатура закрывается — и всё по новой. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#08080a" />
    <title>Aurum-Ex — Личные финансы</title>
    <script>
      // Оформление и тема проставляются до первой отрисовки: иначе кадр
      // показывался бы чужими цветами, пока грузится React.
      //
      // Здесь нельзя вычислить цвет полотна из стилей — они ещё не
      // загружены, — поэтому пары «оформление → цвет» продублированы
      // ниже вручную. Это единственное место, где они повторяются:
      // дальше lib/theme.ts берёт значение из вычисленного стиля.
      (function () {
        var root = document.documentElement;

        var designs = { gold: 1, modern: 1, legacy: 1 };
        var design = localStorage.getItem("aurum:design");
        if (!designs[design]) design = "gold";
        root.setAttribute("data-design", design);

        var theme = localStorage.getItem("aurum:theme");
        if (theme === "light" || theme === "dark") {
          root.setAttribute("data-theme", theme);
        } else {
          theme = "system";
        }
        var dark =
          theme === "dark" ||
          (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        root.setAttribute("data-scheme", dark ? "dark" : "light");

        // Держится в согласии с --surface-0 в index.css.
        var surfaces = {
          gold: { light: "#f6f2ea", dark: "#08080a" },
          modern: { light: "#f7f6f3", dark: "#0a0b0e" },
          legacy: { light: "#f9f9f7", dark: "#0d0d0d" },
        };
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", surfaces[design][dark ? "dark" : "light"]);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
