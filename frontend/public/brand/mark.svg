<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32" width="48" height="32" role="img" aria-label="Aurum-Ex">
  <!--
    Знак приложения: скруглённый прямоугольник вместо прежней золотой монеты.
    Соотношение 3:2 — под него рассчитаны все места, где знак показывается
    (свёрнутое меню, шапка мобильного меню, экран входа).

    Стиль переключается медиазапросом внутри самого файла: SVG,
    подключённый через <img>, свои @media honours, а цвета приложения через
    CSS-переменные не видит. Ручной выбор темы в настройках знак не
    переключит — по системной он всё равно попадает в тон, а собственная
    подложка не даёт ему потеряться ни на светлом, ни на тёмном.

    Это временная отрисовка под будущий файл: заменяется целиком, размеры
    слота см. docs/brand.md.
  -->
  <style>
    .plate { fill: #23262b; }
    .edge  { stroke: #ffffff; stroke-opacity: 0.10; }
    .glyph { fill: #f6f7f9; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #eceef2; }
      .edge  { stroke: #000000; stroke-opacity: 0.12; }
      .glyph { fill: #16181c; }
    }
  </style>
  <rect class="plate edge" x="0.6" y="0.6" width="46.8" height="30.8" rx="9" stroke-width="1.2"/>
  <text class="glyph" x="24" y="21.2" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="13" font-weight="700" letter-spacing="-0.4">A-Ex</text>
</svg>
