<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Aurum-Ex">
  <!--
    Значок вкладки. Квадрат со скруглением в духе material — не круг: круглая
    монета с засечной «A» смотрелась чужеродно рядом с остальным оформлением.

    Одна буква, а не «A-Ex»: значок читают шириной в шестнадцать точек, и
    четыре знака в этом размере сливаются в пятно.

    Цвета фиксированные, без медиазапроса: панель вкладок у браузеров своя,
    и подстроиться под неё нельзя — поэтому графитовая подложка со светлой
    буквой и тонкой каймой, чтобы значок не пропадал ни на светлой полосе,
    ни на тёмной.

    Временная отрисовка под будущий файл: заменяется целиком, размеры и
    прочие форматы см. docs/brand.md.
  -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#23262b" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.4"/>
  <text x="16" y="23" text-anchor="middle" fill="#f6f7f9"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="20" font-weight="700">A</text>
</svg>
