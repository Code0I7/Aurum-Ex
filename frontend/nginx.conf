server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Always open, no auth — this is what Docker's own HEALTHCHECK and any
    # external uptime monitor hit, and it returns nothing but {"status":"ok"}.
    # docker-entrypoint.d/20-basic-auth.sh writes basic-auth.conf; without an
    # explicit "auth_basic off" here this location would inherit whatever it
    # sets below and healthchecks would start failing with 401.
    location = /api/health {
        auth_basic off;
        proxy_pass http://backend:8000/api/health;
        proxy_set_header Host $host;
    }

    # Reverse proxy to the FastAPI backend container. basic-auth.conf is
    # generated at container start (empty if AURUM_BASIC_AUTH_USER/PASSWORD
    # aren't set, so this is a no-op by default) — see docker-entrypoint.d/.
    location /api/ {
        include /etc/nginx/basic-auth.conf;
        # Размер тела запроса. По умолчанию nginx принимает мегабайт, и это
        # ломало ровно одну вещь, зато насмерть: восстановление из копии.
        # Копия — один JSON со всей историей, и четыре года учёта весят
        # полтора мегабайта. Выгрузка при этом работала (она скачивание), а
        # загрузка отвечала 413, и починить это из приложения было нельзя.
        #
        # Сто мегабайт — с запасом на десятилетия и на перенос таблицы,
        # который тоже приходит сюда файлом. Не «без ограничения»: тело
        # читается в память, и отсутствие предела — приглашение забить её
        # одним запросом.
        #
        # У edge, который стоит снаружи, свой предел — 32 мегабайта, и он
        # ниже намеренно: наружу смотрит он, и публичный предел строже
        # внутреннего. Здешний больше потому, что к этому nginx ходят и
        # напрямую, через туннель, минуя edge.
        client_max_body_size 100m;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Манифест установки. Без явного типа nginx отдаёт .webmanifest как
    # поток байтов, и Chrome отказывается предлагать установку на главный
    # экран — молча, без сообщения в консоли.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # Служебный работник обязан отдаваться без кэша: иначе браузер месяцами
    # держит старую копию и обновление приложения до телефона не доходит.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback — client-side routing handles the rest. Deliberately NOT
    # behind auth_basic: this is just the built HTML/JS/CSS shell, no
    # financial data lives in it. The app's own branded login screen
    # (frontend/src/components/auth/LoginGate.tsx) is what actually gates
    # entry, by requiring a valid Authorization header on every /api/ call
    # above — the real protection stays exactly where it was.
    # Собранные файлы: имя содержит отпечаток содержимого, поэтому новая
    # сборка — это всегда новое имя, и старое можно держать в кэше сколько
    # угодно. Здесь кэш не вредит, а экономит: приложение на телефоне
    # открывается мгновенно.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # А вот index.html кэшировать нельзя ни минуты, и это не украшение.
    #
    # Имя у него постоянное, а внутри — ссылка на файл сборки с отпечатком.
    # Без явного запрета браузер вправе взять его из кэша по своему
    # усмотрению (эвристика от даты изменения), и тогда человек открывает
    # вчерашнюю страницу, которая тянет вчерашний JS. Снаружи это выглядит
    # так, будто обновление не вышло: сервер новый, образ новый, а в
    # браузере старое приложение и нет кнопки, которую только что добавили.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
