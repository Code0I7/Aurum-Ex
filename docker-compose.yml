services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AURUM_POSTGRES_USER:-aurum}
      POSTGRES_PASSWORD: ${AURUM_POSTGRES_PASSWORD:-aurum}
      POSTGRES_DB: ${AURUM_POSTGRES_DB:-aurum}
    volumes:
      - aurum_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AURUM_POSTGRES_USER:-aurum}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      AURUM_POSTGRES_USER: ${AURUM_POSTGRES_USER:-aurum}
      AURUM_POSTGRES_PASSWORD: ${AURUM_POSTGRES_PASSWORD:-aurum}
      AURUM_POSTGRES_DB: ${AURUM_POSTGRES_DB:-aurum}
      AURUM_POSTGRES_HOST: db
      AURUM_POSTGRES_PORT: 5432
      AURUM_CORS_ORIGINS: ${AURUM_CORS_ORIGINS:-}
      AURUM_DEFAULT_CURRENCY: ${AURUM_DEFAULT_CURRENCY:-RUB}
      # Вход: см. .env.example. Пароль не задан — приложение при первом
      # открытии само попросит задать его в браузере.
      AURUM_ADMIN_USERNAME: ${AURUM_ADMIN_USERNAME:-admin}
      AURUM_ADMIN_PASSWORD: ${AURUM_ADMIN_PASSWORD:-}
      AURUM_RECOVERY_KEY: ${AURUM_RECOVERY_KEY:-}
      AURUM_SESSION_TTL_HOURS: ${AURUM_SESSION_TTL_HOURS:-336}
      AURUM_MAX_FAILED_LOGINS: ${AURUM_MAX_FAILED_LOGINS:-10}
      AURUM_LOCKOUT_MINUTES: ${AURUM_LOCKOUT_MINUTES:-15}
      AURUM_SECURE_COOKIES: ${AURUM_SECURE_COOKIES:-false}
      # Free CoinGecko Demo key (coingecko.com/en/api/pricing) — the Crypto
      # tab's price sync 400s with a clear message until this is set.
      AURUM_COINGECKO_API_KEY: ${AURUM_COINGECKO_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      # Только петля. Наружу приложение выходит через edge, за TLS; открытый
      # HTTP-порт на всех интерфейсах — это пароль в открытом виде, стоит
      # кому-то однажды разрешить порт в межсетевом экране.
      - "127.0.0.1:${AURUM_WEB_PORT:-3000}:80"
    environment:
      # Both unset = no login screen at all. See frontend/docker-entrypoint.d/20-basic-auth.sh.
      AURUM_BASIC_AUTH_USER: ${AURUM_BASIC_AUTH_USER:-}
      AURUM_BASIC_AUTH_PASSWORD: ${AURUM_BASIC_AUTH_PASSWORD:-}
    depends_on:
      - backend

  # Внешняя дверь: TLS плюс калитка по секретной ссылке. Включается
  # профилем, потому что на ноутбуке ей делать нечего — там нет ни домена,
  # ни сертификата. На сервере профиль задаётся строкой COMPOSE_PROFILES в
  # .env, поэтому обычная `docker compose up -d` поднимает и её тоже.
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    profiles: ["public"]
    ports:
      - "${AURUM_PUBLIC_PORT:-48443}:443"
    environment:
      AURUM_DOMAIN: ${AURUM_DOMAIN:-}
      AURUM_GATE_KEY: ${AURUM_GATE_KEY:-}
    volumes:
      - ./edge/templates:/etc/nginx/templates:ro
      - ./edge/docker-entrypoint.d/10-check-env.sh:/docker-entrypoint.d/10-check-env.sh:ro
      # Только свой сертификат, а не весь /etc/letsencrypt: соседние домены
      # на этой машине принадлежат чужому сервису, и их закрытые ключи
      # нашему контейнеру видеть незачем. Каталог archive нужен потому, что
      # в live лежат символические ссылки на него.
      - /etc/letsencrypt/live/${AURUM_DOMAIN:-none}:/etc/letsencrypt/live/${AURUM_DOMAIN:-none}:ro
      - /etc/letsencrypt/archive/${AURUM_DOMAIN:-none}:/etc/letsencrypt/archive/${AURUM_DOMAIN:-none}:ro
    depends_on:
      - web

volumes:
  aurum_pgdata:
