[pytest]
asyncio_mode = auto
# Один цикл событий на весь прогон — и у фикстур, и у тестов.
#
# Было по циклу на тест, и из-за этого на каждый тест создавался свой
# движок SQLAlchemy: соединение asyncpg принадлежит тому циклу, в котором
# открыто, и переиспользовать пул из чужого цикла нельзя («attached to a
# different loop»). Один общий цикл снимает это ограничение, и движок
# становится один на прогон.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
pythonpath = .
testpaths = tests
